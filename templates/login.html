{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nagara Setu — Civic Portal Login & Registration</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link rel="icon" href="{% static 'nagara_setu_logo.svg' %}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
    <style>
        body {
            background: #03080b;
            color: #e7f3f0;
        }
        .brand-shell {
            width: min(100%, 520px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 0.2rem;
        }
        .brand-mark {
            width: min(32vw, 190px);
            max-width: 190px;
            height: auto;
            display: block;
            filter: drop-shadow(0 18px 28px rgba(20, 124, 170, 0.35));
        }
        .brand-txt {
            font-size: clamp(2.4rem, 5vw, 4.5rem);
            line-height: 0.9;
            letter-spacing: -0.08em;
            font-weight: 900;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #7dd3fc;
        }
        .brand-txt .brand-accent { color: #86efac; }
        .brand-tagline {
            letter-spacing: 0.18rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #c7e9ff;
            font-weight: 700;
            opacity: 0.9;
            text-align: center;
        }
        .brand-hr {
            width: min(80%, 650px);
            height: 2px;
            background: linear-gradient(90deg, rgba(13,93,141,0.2), rgba(13,93,141,1), rgba(57,185,119,1), rgba(57,185,119,0.2));
            border: none;
            margin: 0.15rem auto 0.35rem auto;
        }
        #main-content {
            background: rgba(255,255,255,0.96);
            box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            margin-top: 1.25rem;
        }
        #main-content input { color: #000000; }
        #main-content input::placeholder { color: #6b7280; opacity: 1; }
        #main-content select, #main-content select option { color: #000000; }
        .password-toggle { position: absolute; top: 50%; right: .5rem; transform: translateY(-50%); transition: background-color .2s, color .2s; }
        #btn-toggle-password:hover:not(:disabled) { transform: translateY(-50%); }
        @media (max-width: 480px) {
            body { padding: .75rem; justify-content: flex-start; font-size: .875rem; }
            .brand-shell { gap: .25rem; margin-bottom: 0.1rem; }
            .brand-mark { width: min(40vw, 160px); }
            .brand-txt { letter-spacing: -0.05em; }
            .brand-tagline { letter-spacing: 0.1rem; font-size: 0.55rem; }
            #main-content { padding: 1.25rem; margin-top: .75rem; border-radius: 1.5rem; }
            #demo-pills-box .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            #main-content > div:last-child { align-items: flex-start; flex-direction: column; gap: .5rem; }
            #main-content > div:last-child nav { width: 100%; justify-content: space-between; }
            #main-content .text-sm { font-size: .8125rem; }
            #main-content { gap: 1rem; }
            #main-content input, #main-content select, #main-content button { padding-top: .625rem; padding-bottom: .625rem; font-size: .8125rem; }
        }
        @media (min-width: 481px) and (max-width: 767px) {
            body { padding: 1rem; justify-content: flex-start; overflow-y: auto; font-size: .875rem; }
            .brand-mark { width: min(30vw, 150px); }
            .brand-txt { font-size: 3rem; }
            #main-content { padding: 1.5rem; margin-top: 1rem; }
            #main-content button, #main-content input, #main-content select { min-height: 2.5rem; }
            #main-content .text-sm { font-size: .8125rem; }
        }
    </style>

</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 font-sans civix-enter">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:bg-white focus:px-4 focus:py-2 focus:text-primary focus:font-bold focus:shadow-lg">Skip to main content</a>

    <header class="brand-shell">
        <img src="{% static 'nagara_setu_logo.svg' %}" alt="Nagara Setu logo" class="brand-mark"/>
        <div class="text-center">
            <h1 class="brand-txt">Nagara<span class="brand-accent">Setu</span></h1>
            <hr class="brand-hr"/>
            <div class="brand-tagline">Bridging Citizens. Building Better Cities</div>
        </div>
    </header>

    <div id="main-content" role="main" tabindex="-1" class="max-w-md w-full bg-white rounded-3xl p-8 border border-outline-variant shadow-2xl civix-panel civix-glass flex flex-col gap-6">
        {% csrf_token %}
        
        <!-- Brand Header -->
        <div class="flex flex-col items-center text-center gap-2">
            <p class="text-xs text-on-surface-variant">Phone-First Civic Reporting & City Management</p>
        </div>

        <!-- Auth Toggle: Login vs Register -->
        <div class="flex bg-surface-container p-1 rounded-2xl border border-outline-variant text-xs font-bold">
            <button id="btn-tab-login" onclick="showAuthTab('login')" class="flex-1 py-2 rounded-xl bg-white text-primary shadow-xs transition-all">Sign In (Phone)</button>
            <button id="btn-tab-register" onclick="showAuthTab('register')" class="flex-1 py-2 rounded-xl text-on-surface-variant hover:text-primary transition-all">New Citizen Register</button>
        </div>

        <p id="login-message" tabindex="-1" class="hidden rounded-xl border border-amber-300 bg-amber-50 p-3 text-xs font-semibold text-amber-900" role="alert"></p>

        <!-- FORM 1: LOGIN (Phone-First) -->
        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label for="login-identifier" class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Username or Phone Number</label>
                <input id="login-identifier" type="text" required autocomplete="username" placeholder="Enter your username or phone number" class="w-full p-3.5 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-mono font-bold outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
            </div>
            <div>
                <label for="login-password" class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Password</label>
                <div class="relative">
                    <input id="login-password" type="password" required autocomplete="current-password" placeholder="Enter your password" class="w-full p-3.5 pr-12 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-medium outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
                    <button id="btn-toggle-password" type="button" class="password-toggle p-2 rounded-lg text-on-surface-variant hover:bg-surface-container" aria-label="Show password" aria-pressed="false" title="Show password">
                        <span id="password-visibility-icon" class="material-symbols-outlined text-lg">visibility</span>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-primary-container active:scale-98 transition-all flex items-center justify-center gap-2 mt-1">
                <span class="material-symbols-outlined text-lg">login</span>
                <span>Sign In</span>
            </button>
        </form>

        <!-- FORM 2: CITIZEN REGISTRATION (Hidden by default) -->
        <form id="register-form" class="hidden flex flex-col gap-3">
            <div>
                <label for="reg-name" class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Full Name</label>
                    <input id="reg-name" type="text" required autocomplete="name" placeholder="E.g. Sundar Pichai" class="w-full p-3 border border-outline-variant rounded-xl bg-surface-container-low text-sm outline-none focus:border-primary"/>
            </div>
            <div>
                <label for="reg-phone" class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Mobile Phone Number</label>
                <div class="flex gap-2">
                    <span class="p-3 border border-outline-variant rounded-xl bg-surface-container text-sm font-bold text-on-surface">+91</span>
                    <input id="reg-phone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="9876543210" class="flex-1 p-3 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-mono font-bold outline-none focus:border-primary"/>
                </div>
            </div>
            <div>
                <label for="reg-zone" class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Municipal Ward / Zone</label>
                <select id="reg-zone" class="w-full p-3 border border-outline-variant rounded-xl bg-white text-sm font-semibold outline-none focus:border-primary">
                    <option value="Zone 5 - Adyar">Zone 5 - Adyar</option>
                    <option value="Zone 8 - Anna Nagar">Zone 8 - Anna Nagar</option>
                    <option value="Zone 9 - Teynampet">Zone 9 - Teynampet</option>
                    <option value="Zone 10 - Kodambakkam">Zone 10 - Kodambakkam</option>
                    <option value="Zone 13 - Alandur">Zone 13 - Alandur</option>
                    <option value="Zone 14 - Perungudi">Zone 14 - Perungudi</option>
                    <option value="Zone 15 - Sholinganallur">Zone 15 - Sholinganallur</option>
                </select>
            </div>
            <div>
                <label for="reg-password" class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Create Password</label>
                <input id="reg-password" type="password" required autocomplete="new-password" value="citizen123" class="w-full p-3 border border-outline-variant rounded-xl bg-surface-container-low text-sm outline-none focus:border-primary"/>
            </div>
            <button type="submit" class="w-full bg-secondary text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-secondary-container hover:text-on-secondary-container active:scale-98 transition-all flex items-center justify-center gap-2 mt-2">
                <span class="material-symbols-outlined text-lg">person_add</span>
                <span>Register & Get +50 Civic Points</span>
            </button>
        </form>

    </div>

    <script>
        function showAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('btn-tab-login').className = "flex-1 py-2 rounded-xl bg-white text-primary shadow-xs transition-all";
                document.getElementById('btn-tab-register').className = "flex-1 py-2 rounded-xl text-on-surface-variant hover:text-primary transition-all";
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('btn-tab-register').className = "flex-1 py-2 rounded-xl bg-white text-secondary shadow-xs transition-all font-bold";
                document.getElementById('btn-tab-login').className = "flex-1 py-2 rounded-xl text-on-surface-variant hover:text-primary transition-all";
            }
        }

        const loginMessage = document.getElementById('login-message');
        function showLoginMessage(message) {
            loginMessage.textContent = message;
            loginMessage.classList.remove('hidden');
            loginMessage.focus();
        }
        const loginPassword = document.getElementById('login-password');
        const togglePasswordButton = document.getElementById('btn-toggle-password');
        const passwordVisibilityIcon = document.getElementById('password-visibility-icon');
        togglePasswordButton.addEventListener('click', () => {
            const visible = loginPassword.type === 'text';
            loginPassword.type = visible ? 'password' : 'text';
            togglePasswordButton.setAttribute('aria-pressed', String(!visible));
            togglePasswordButton.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
            togglePasswordButton.title = visible ? 'Show password' : 'Hide password';
            passwordVisibilityIcon.textContent = visible ? 'visibility' : 'visibility_off';
        });
        const loginError = new URLSearchParams(window.location.search).get('error');
        if (loginError) {
            loginMessage.textContent = loginError;
            loginMessage.classList.remove('hidden');
        }

        async function readApiResponse(response) {
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                throw new Error(`Server returned HTTP ${response.status} instead of JSON.`);
            }
            return response.json();
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch("/api/users/login/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-CSRFToken": document.querySelector('input[name="csrfmiddlewaretoken"]').value },
                    body: JSON.stringify({ identifier, password }),
                    credentials: 'same-origin'
                });
                const data = await readApiResponse(res);
                if (res.ok && data.redirect_url) {
                    localStorage.setItem('civix_user', JSON.stringify(data.user));
                    window.location.href = data.redirect_url;
                } else {
                    showLoginMessage(data.error || "Login failed");
                }
            } catch (err) {
                showLoginMessage("Login request error: " + err.message);
            }
        });

        // Citizen Registration Handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const zone = document.getElementById('reg-zone').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch("/api/users/register/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-CSRFToken": document.querySelector('input[name="csrfmiddlewaretoken"]').value },
                    body: JSON.stringify({ full_name, phone, zone, password }),
                    credentials: 'same-origin'
                });
                const data = await readApiResponse(res);
                if (res.ok && data.redirect_url) {
                    showLoginMessage(data.message);
                    localStorage.setItem('civix_user', JSON.stringify(data.user));
                    window.location.href = data.redirect_url;
                } else {
                    showLoginMessage(data.error || "Registration failed");
                }
            } catch (err) {
                showLoginMessage("Registration request error: " + err.message);
            }
        });
    </script>
</body>
</html>
