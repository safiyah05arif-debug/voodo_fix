<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CIVIX — Civic Portal Login & Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#003f87",
                        "primary-container": "#0056b3",
                        "on-primary": "#ffffff",
                        secondary: "#006e25",
                        "secondary-container": "#80f98b",
                        error: "#ba1a1a",
                        surface: "#f8f9fa",
                        "surface-container": "#edeeef",
                        "surface-container-low": "#f3f4f5",
                        "on-surface": "#191c1d",
                        "on-surface-variant": "#424752",
                        outline: "#727784",
                        "outline-variant": "#c2c6d4"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-outline-variant shadow-2xl flex flex-col gap-6">
        
        <!-- Brand Header -->
        <div class="flex flex-col items-center text-center gap-1">
            <div class="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center font-black text-3xl shadow-md mb-2">C</div>
            <h1 class="font-black text-3xl tracking-tight text-primary">CIVIX</h1>
            <p class="text-xs text-on-surface-variant">Phone-First Civic Reporting & City Management</p>
        </div>

        <!-- Auth Toggle: Login vs Register -->
        <div class="flex bg-surface-container p-1 rounded-2xl border border-outline-variant text-xs font-bold">
            <button id="btn-tab-login" onclick="showAuthTab('login')" class="flex-1 py-2 rounded-xl bg-white text-primary shadow-xs transition-all">Sign In (Phone)</button>
            <button id="btn-tab-register" onclick="showAuthTab('register')" class="flex-1 py-2 rounded-xl text-on-surface-variant hover:text-primary transition-all">New Citizen Register</button>
        </div>

        <!-- 1-Click Role Login Demo Pills -->
        <div id="demo-pills-box" class="bg-surface-container-low p-3 rounded-2xl border border-outline-variant text-xs">
            <span class="font-bold text-on-surface block mb-2 text-center text-[11px] uppercase tracking-wider">⚡ 1-Click Role Login for Hackathon Demo:</span>
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="fillLogin('+919876543210')" class="bg-white border hover:border-primary p-2 rounded-xl text-center shadow-xs transition-all">
                    <span class="block font-bold text-primary">Citizen</span>
                    <span class="text-[10px] text-outline">Ravi K.</span>
                </button>
                <button onclick="fillLogin('+919876543212')" class="bg-white border hover:border-primary p-2 rounded-xl text-center shadow-xs transition-all">
                    <span class="block font-bold text-secondary">Worker</span>
                    <span class="text-[10px] text-outline">Murugan S.</span>
                </button>
                <button onclick="fillLogin('+919876543214')" class="bg-white border hover:border-primary p-2 rounded-xl text-center shadow-xs transition-all">
                    <span class="block font-bold text-amber-700">Officer</span>
                    <span class="text-[10px] text-outline">Anand K.</span>
                </button>
            </div>
        </div>

        <!-- FORM 1: LOGIN (Phone-First) -->
        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Mobile Phone Number</label>
                <div class="flex gap-2">
                    <span class="p-3.5 border border-outline-variant rounded-xl bg-surface-container text-sm font-bold text-on-surface">+91</span>
                    <input id="login-phone" type="tel" required placeholder="9876543210" value="9876543210" class="flex-1 p-3.5 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-mono font-bold outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
                </div>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Password</label>
                <input id="login-password" type="password" required value="demo123" class="w-full p-3.5 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-medium outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
            </div>
            <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-primary-container active:scale-98 transition-all flex items-center justify-center gap-2 mt-1">
                <span class="material-symbols-outlined text-lg">login</span>
                <span>Sign In with Phone</span>
            </button>
        </form>

        <!-- FORM 2: CITIZEN REGISTRATION (Hidden by default) -->
        <form id="register-form" class="hidden flex flex-col gap-3">
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Full Name</label>
                <input id="reg-name" type="text" required placeholder="E.g. Sundar Pichai" class="w-full p-3 border border-outline-variant rounded-xl bg-surface-container-low text-sm outline-none focus:border-primary"/>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Mobile Phone Number</label>
                <div class="flex gap-2">
                    <span class="p-3 border border-outline-variant rounded-xl bg-surface-container text-sm font-bold text-on-surface">+91</span>
                    <input id="reg-phone" type="tel" required placeholder="9876543210" class="flex-1 p-3 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-mono font-bold outline-none focus:border-primary"/>
                </div>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Municipal Ward / Zone</label>
                <select id="reg-zone" class="w-full p-3 border border-outline-variant rounded-xl bg-white text-sm font-semibold outline-none focus:border-primary">
                    <option value="Zone 5 - Adyar">Zone 5 - Adyar</option>
                    <option value="Zone 8 - Anna Nagar">Zone 8 - Anna Nagar</option>
                    <option value="Zone 9 - Teynampet">Zone 9 - Teynampet</option>
                    <option value="Zone 10 - Kodambakkam">Zone 10 - Kodambakkam</option>
                    <option value="Zone 13 - Alandur">Zone 13 - Alandur</option>
                    <option value="Zone 14 - Perungudi">Zone 14 - Perungudi</option>
                    <option value="Zone 15 - Sholinganallur">Zone 15 - Sholinganallur</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Create Password</label>
                <input id="reg-password" type="password" required value="citizen123" class="w-full p-3 border border-outline-variant rounded-xl bg-surface-container-low text-sm outline-none focus:border-primary"/>
            </div>
            <button type="submit" class="w-full bg-secondary text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-secondary-container hover:text-on-secondary-container active:scale-98 transition-all flex items-center justify-center gap-2 mt-2">
                <span class="material-symbols-outlined text-lg">person_add</span>
                <span>Register & Get +50 Civic Points</span>
            </button>
        </form>

        <!-- Direct Portal Jump Links -->
        <div class="pt-4 border-t border-outline-variant/60 flex justify-between items-center text-xs text-on-surface-variant">
            <span class="font-bold">Direct Portals:</span>
            <div class="flex gap-2 font-bold">
                <a href="/citizen/" class="text-primary hover:underline">Citizen</a>
                <span>•</span>
                <a href="/worker/" class="text-secondary hover:underline">Worker</a>
                <span>•</span>
                <a href="/officer/" class="text-amber-800 hover:underline">Officer</a>
            </div>
        </div>

    </div>

    <script>
        function showAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('demo-pills-box').classList.remove('hidden');
                document.getElementById('btn-tab-login').className = "flex-1 py-2 rounded-xl bg-white text-primary shadow-xs transition-all";
                document.getElementById('btn-tab-register').className = "flex-1 py-2 rounded-xl text-on-surface-variant hover:text-primary transition-all";
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('demo-pills-box').classList.add('hidden');
                document.getElementById('btn-tab-register').className = "flex-1 py-2 rounded-xl bg-white text-secondary shadow-xs transition-all font-bold";
                document.getElementById('btn-tab-login').className = "flex-1 py-2 rounded-xl text-on-surface-variant hover:text-primary transition-all";
            }
        }

        function fillLogin(phone) {
            document.getElementById('login-phone').value = phone.replace('+91', '');
            document.getElementById('login-password').value = 'demo123';
        }

        async function readApiResponse(response) {
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                throw new Error(`Server returned HTTP ${response.status} instead of JSON.`);
            }
            return response.json();
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch("/api/users/login/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, password })
                });
                const data = await readApiResponse(res);
                if (res.ok && data.redirect_url) {
                    localStorage.setItem('civix_user', JSON.stringify(data.user));
                    window.location.href = data.redirect_url;
                } else {
                    alert(data.error || "Login failed");
                }
            } catch (err) {
                alert("Login request error: " + err);
            }
        });

        // Citizen Registration Handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const zone = document.getElementById('reg-zone').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch("/api/users/register/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ full_name, phone, zone, password })
                });
                const data = await readApiResponse(res);
                if (res.ok && data.redirect_url) {
                    alert(data.message);
                    localStorage.setItem('civix_user', JSON.stringify(data.user));
                    window.location.href = data.redirect_url;
                } else {
                    alert(data.error || "Registration failed");
                }
            } catch (err) {
                alert("Registration request error: " + err);
            }
        });
    </script>
</body>
</html>
