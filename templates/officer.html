<!DOCTYPE html>
<html class="h-full light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CIVIX — Municipal Officer Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
    
    <!-- Leaflet & Heatmap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#003f87",
                        "primary-container": "#0056b3",
                        "on-primary": "#ffffff",
                        secondary: "#006e25",
                        "secondary-container": "#80f98b",
                        error: "#ba1a1a",
                        "error-container": "#ffdad6",
                        surface: "#f8f9fa",
                        "surface-container": "#edeeef",
                        "surface-container-low": "#f3f4f5",
                        "on-surface": "#191c1d",
                        "on-surface-variant": "#424752",
                        outline: "#727784",
                        "outline-variant": "#c2c6d4"
                    }
                }
            }
        }
    </script>
    <style>
        .pulse-red { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; color: #ba1a1a; } 50% { opacity: .4; color: #ba1a1a; } }
        #officer-map { width: 100%; height: 100%; z-index: 10; }
    </style>
</head>
<body class="bg-surface text-on-surface h-full font-sans overflow-hidden flex flex-col">

    <!-- Top Command Navigation Bar -->
    <header class="bg-primary text-white border-b border-primary-container px-6 py-3 flex justify-between items-center z-40 shrink-0 shadow-md">
        <div class="flex items-center gap-4">
            <div class="font-black text-2xl tracking-wider text-white">CIVIX COMMAND</div>
            <span class="bg-white/20 text-xs px-2.5 py-0.5 rounded-full font-bold">Zone 5 • Chennai Central</span>
        </div>
        <div class="flex items-center gap-6 text-xs">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>System Health: Live (MongoDB Atlas + Vision AI)</span>
            </div>
            <div class="flex items-center gap-3 border-l border-white/20 pl-4">
                <a href="/citizen/" class="underline hover:text-secondary-container">Citizen Portal</a>
                <span>|</span>
                <a href="/worker/" class="underline hover:text-secondary-container">Worker View</a>
            </div>
        </div>
    </header>

    <!-- Main Command Body (Split-Pane) -->
    <div class="flex-1 flex flex-col overflow-hidden">

        <!-- KPI Metrics Banner -->
        <div class="p-4 grid grid-cols-4 gap-4 bg-white border-b border-outline-variant shrink-0 shadow-sm">
            <div class="bg-surface-container-low p-3.5 rounded-xl border border-outline-variant">
                <span class="text-xs text-on-surface-variant font-bold uppercase tracking-wider block">Total Active Issues</span>
                <div class="font-mono text-3xl font-black text-primary mt-1" id="kpi-total">25</div>
            </div>
            <div class="bg-red-50 p-3.5 rounded-xl border border-red-200">
                <span class="text-xs text-red-700 font-bold uppercase tracking-wider block">🔴 Critical Urgency</span>
                <div class="font-mono text-3xl font-black text-red-600 mt-1" id="kpi-critical">10</div>
            </div>
            <div class="bg-amber-50 p-3.5 rounded-xl border border-amber-200">
                <span class="text-xs text-amber-800 font-bold uppercase tracking-wider block">⚠️ SLA Breached</span>
                <div class="font-mono text-3xl font-black text-amber-700 mt-1 pulse-red" id="kpi-sla">22</div>
            </div>
            <div class="bg-emerald-50 p-3.5 rounded-xl border border-emerald-200">
                <span class="text-xs text-emerald-800 font-bold uppercase tracking-wider block">✅ Resolved Today</span>
                <div class="font-mono text-3xl font-black text-emerald-700 mt-1" id="kpi-resolved">12</div>
            </div>
        </div>

        <!-- Split-Pane: Map (Left) + Ticket Queue (Right) -->
        <div class="flex-1 flex overflow-hidden">

            <!-- Left: Interactive Leaflet City Heatmap -->
            <div class="flex-1 relative bg-surface-container-low overflow-hidden">
                <div id="officer-map"></div>
                <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-md p-3 rounded-xl shadow-lg border border-outline-variant z-20 text-xs flex flex-col gap-1.5">
                    <span class="font-bold text-on-surface mb-1">Severity Heatmap Layers</span>
                    <label class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-600"></span> Critical (24h SLA)</label>
                    <label class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span> High (48h SLA)</label>
                    <label class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-600"></span> Resolved</label>
                </div>
            </div>

            <!-- Right: Master Ticket Queue -->
            <div class="w-[460px] bg-white border-l border-outline-variant flex flex-col h-full shrink-0 shadow-lg">
                <div class="p-4 border-b border-outline-variant bg-surface-container-low sticky top-0 z-20 flex justify-between items-center">
                    <h3 class="font-bold text-base text-on-surface">Master Ticket Queue</h3>
                    <span class="text-xs bg-primary/10 text-primary font-bold px-2 py-0.5 rounded-md">Sorted by Priority Score</span>
                </div>
                <div id="master-ticket-queue" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Tickets populated dynamically -->
                </div>
            </div>

        </div>
    </div>

    <script>
        let officerMapInstance = null;

        async function initOfficerCommand() {
            // 1. Initialize Leaflet Map
            officerMapInstance = L.map('officer-map').setView([13.0450, 80.2400], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(officerMapInstance);

            // 2. Fetch Tickets from API
            try {
                const res = await fetch("/api/issues/");
                const issues = await res.json();
                const queueContainer = document.getElementById('master-ticket-queue');
                queueContainer.innerHTML = "";

                const heatPoints = [];

                issues.forEach(iss => {
                    const lat = iss.location.latitude;
                    const lng = iss.location.longitude;
                    const isCritical = iss.severity === 'critical';
                    const markerColor = isCritical ? '#ba1a1a' : (iss.severity === 'high' ? '#f59e0b' : '#006e25');

                    // Add Map Marker
                    L.circleMarker([lat, lng], {
                        color: markerColor,
                        fillColor: markerColor,
                        radius: isCritical ? 9 : 7,
                        fillOpacity: 0.85
                    }).addTo(officerMapInstance).bindPopup(`
                        <div style="font-family:sans-serif; min-width:180px;">
                            <b style="font-size:13px;">${iss.title}</b><br/>
                            <span style="color:${markerColor}; font-weight:bold;">${iss.severity.toUpperCase()}</span> • Priority: <b>${iss.priority_score}</b><br/>
                            <span style="font-size:11px; color:#555;">${iss.address}</span>
                        </div>
                    `);

                    heatPoints.push([lat, lng, isCritical ? 1.0 : 0.6]);

                    // Add Ticket Card to Right Queue
                    const card = document.createElement('div');
                    card.className = `bg-white border-2 ${isCritical ? 'border-red-400' : 'border-outline-variant'} rounded-xl p-3.5 shadow-sm flex flex-col gap-2 hover:shadow-md transition-shadow`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase ${isCritical ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-800'}">${iss.severity}</span>
                            <span class="text-xs font-mono font-bold text-on-surface-variant">#${iss.id.slice(-6).toUpperCase()}</span>
                        </div>
                        <h4 class="font-bold text-sm text-on-surface">${iss.title}</h4>
                        <p class="text-xs text-on-surface-variant flex items-center gap-1">
                            <span class="material-symbols-outlined text-xs">location_on</span> ${iss.address}
                        </p>
                        <div class="grid grid-cols-2 gap-2 bg-surface-container-low p-2 rounded-lg text-xs">
                            <div><span class="text-[10px] uppercase text-outline block">Priority Score</span><span class="font-mono font-bold text-primary">${iss.priority_score}</span></div>
                            <div><span class="text-[10px] uppercase text-outline block">SLA Status</span><span class="font-mono font-bold ${iss.sla_breached ? 'pulse-red' : 'text-emerald-700'}">${iss.sla_breached ? 'BREACHED' : 'ON TRACK'}</span></div>
                        </div>
                        <div class="pt-2 border-t flex justify-between items-center text-xs">
                            <select onchange="assignWorker('${iss.id}', this.value)" class="text-xs p-1.5 border rounded bg-white font-semibold outline-none focus:border-primary">
                                <option value="">Assign Worker...</option>
                                <option value="Murugan S" ${iss.assigned_to === 'Murugan S' ? 'selected' : ''}>Murugan S. (Roads)</option>
                                <option value="Lakshmi N" ${iss.assigned_to === 'Lakshmi N' ? 'selected' : ''}>Lakshmi N. (Water)</option>
                            </select>
                            <span class="text-[11px] text-outline">${iss.upvote_count} Upvotes</span>
                        </div>
                    `;
                    queueContainer.appendChild(card);
                });

                // Add Heatmap Layer
                if (window.L.heatLayer && heatPoints.length > 0) {
                    L.heatLayer(heatPoints, { radius: 25, blur: 15, maxZoom: 14 }).addTo(officerMapInstance);
                }

            } catch (err) {
                console.error(err);
            }
        }

        async function assignWorker(issueId, workerName) {
            if (!workerName) return;
            await fetch(`/api/issues/${issueId}/assign/`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ worker_id: workerName, officer_id: "Officer_Chennai" })
            });
            alert(`Task assigned to ${workerName}!`);
        }

        window.addEventListener('DOMContentLoaded', initOfficerCommand);
    </script>
</body>
</html>
