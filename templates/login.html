<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CIVIX — Civic Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#003f87",
                        "primary-container": "#0056b3",
                        "on-primary": "#ffffff",
                        secondary: "#006e25",
                        "secondary-container": "#80f98b",
                        error: "#ba1a1a",
                        surface: "#f8f9fa",
                        "surface-container": "#edeeef",
                        "surface-container-low": "#f3f4f5",
                        "on-surface": "#191c1d",
                        "on-surface-variant": "#424752",
                        outline: "#727784",
                        "outline-variant": "#c2c6d4"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-outline-variant shadow-2xl flex flex-col gap-6">
        
        <!-- Brand Header -->
        <div class="flex flex-col items-center text-center gap-1">
            <div class="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center font-black text-3xl shadow-md mb-2">C</div>
            <h1 class="font-black text-3xl tracking-tight text-primary">CIVIX</h1>
            <p class="text-xs text-on-surface-variant">Crowdsourced Civic Reporting & Management</p>
        </div>

        <!-- Role Quick Switcher Demo Pills -->
        <div class="bg-surface-container-low p-3 rounded-2xl border border-outline-variant text-xs">
            <span class="font-bold text-on-surface block mb-2 text-center text-[11px] uppercase tracking-wider">⚡ 1-Click Role Login for Hackathon Demo:</span>
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="fillLogin('ravi.kumar@example.com', 'citizen')" class="bg-white border hover:border-primary p-2 rounded-xl text-center shadow-xs transition-all">
                    <span class="block font-bold text-primary">Citizen</span>
                    <span class="text-[10px] text-outline">Ravi K.</span>
                </button>
                <button onclick="fillLogin('murugan.s@example.com', 'field_worker')" class="bg-white border hover:border-primary p-2 rounded-xl text-center shadow-xs transition-all">
                    <span class="block font-bold text-secondary">Worker</span>
                    <span class="text-[10px] text-outline">Murugan S.</span>
                </button>
                <button onclick="fillLogin('officer.chennai@example.com', 'officer')" class="bg-white border hover:border-primary p-2 rounded-xl text-center shadow-xs transition-all">
                    <span class="block font-bold text-amber-700">Officer</span>
                    <span class="text-[10px] text-outline">Anand K.</span>
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Email Address</label>
                <input id="email-input" type="email" required value="ravi.kumar@example.com" class="w-full p-3.5 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-medium outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-on-surface-variant block mb-1">Password</label>
                <input id="password-input" type="password" required value="password123" class="w-full p-3.5 border border-outline-variant rounded-xl bg-surface-container-low text-sm font-medium outline-none focus:border-primary focus:ring-1 focus:ring-primary"/>
            </div>
            <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-primary-container active:scale-98 transition-all flex items-center justify-center gap-2 mt-1">
                <span class="material-symbols-outlined text-lg">login</span>
                <span>Enter Portal</span>
            </button>
        </form>

        <!-- Direct Portal Jump Links -->
        <div class="pt-4 border-t border-outline-variant/60 flex justify-between items-center text-xs text-on-surface-variant">
            <span class="font-bold">Direct Access:</span>
            <div class="flex gap-2">
                <a href="/citizen/" class="text-primary font-bold hover:underline">Citizen</a>
                <span>•</span>
                <a href="/worker/" class="text-secondary font-bold hover:underline">Worker</a>
                <span>•</span>
                <a href="/officer/" class="text-amber-800 font-bold hover:underline">Officer</a>
            </div>
        </div>

    </div>

    <script>
        function fillLogin(email, role) {
            document.getElementById('email-input').value = email;
            document.getElementById('password-input').value = 'demo123';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            try {
                const res = await fetch("/api/users/login/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.redirect_url) {
                    localStorage.setItem('civix_user', JSON.stringify(data.user));
                    window.location.href = data.redirect_url;
                } else {
                    alert(data.error || "Login failed");
                }
            } catch (err) {
                alert("Login request error: " + err);
            }
        });
    </script>
</body>
</html>
